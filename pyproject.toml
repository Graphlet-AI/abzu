[tool.poetry]
name = "abzu"
version = "0.1.0"
description = "Project Abzu"
authors = ["Russell Jurney <russell.jurney@gmail.com>"]
license = "COMMERCIAL"
readme = "README.md"
packages = [{ include = "abzu" }]

[tool.poetry.urls]
"Code Repository" = "https://github.com/Graphlet-AI/abzu"
"Bug Tracker" = "https://github.com/Graphlet-AI/abzu/issues"

[tool.poetry.scripts]
process-articles = "abzu.cli.process_articles:main"
abzu = "abzu.cli.click_cli:main"

[tool.poetry.dependencies]
python = "3.12.*"
scrapy = "^2.12.0"
baml-py = "^0.86.1"
pyspark = "^3.5.5"
python-dateutil = "^2.9.0.post0"
pydantic = "^2.11.3"
pandas = "^2.2.3"
graphistry = "^0.36.0"
pyarrow = "^19.0.1"
seaborn = "^0.13.2"
networkx = "^3.4.2"
matplotlib = "^3.10.1"
graphframes-latest = "^0.8.3"
requests = "^2.32.3"
click = "^8.1.8"
langchain = "^0.3.24"
langchain-community = "^0.3.23"
openai = "^1.76.2"
tqdm = "^4.66.1"
kuzu = "^0.9.0"
feedparser = "^6.0.11"
browsercookie = "^0.8.1"
cloudscraper = "^1.2.71"
types-beautifulsoup4 = "^4.12.0.20250204"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.2.0"
isort = "^5.13.2"
mypy = "^1.14.0"
pytest = "^8.3.4"
ipython = "^8.31.0"
pandas-stubs = "^2.2.3.241126"
ipykernel = "^6.29.5"
nbformat = "^5.10.4"
jupyter-black = "^0.4.0"
pre-commit = "^4.1.0"
jupyter = "^1.1.1"
nbdime = "^4.0.2"
types-requests = "^2.32.0.20250328"
flake8-pyproject = "^1.2.3"
poetry-types = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[[tool.poetry.source]]
name = "rapids"
url = "https://pypi.nvidia.com"
priority = "supplemental"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["abzu", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["abzu", "tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
ignore = ["E203", "E266", "E501", "W503", "C901"]
extend-ignore = ["E203", "E266", "E501", "W503", "C901"]

[[tool.mypy.overrides]]
module = "abzu.baml_client.*"
ignore_errors = true
