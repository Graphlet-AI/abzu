[tool.poetry]
name = "abzu"
version = "0.1.0"
description = "Project Abzu"
authors = ["Russell Jurney <russell.jurney@gmail.com>"]
license = "COMMERCIAL"
readme = "README.md"
packages = [{include = "abzu"}]

[tool.poetry.urls]
"Code Repository" = "https://github.com/Graphlet-AI/abzu"
"Bug Tracker" = "https://github.com/Graphlet-AI/abzu/issues"

[tool.poetry.scripts]
process-articles = "abzu.cli.process_articles:main"
abzu = "abzu.cli:main"

[tool.poetry.dependencies]
python = "3.12.*"
scrapy = "^2.12.0"
baml-py = "^0.83.0"
pyspark = "^3.5.5"
python-dateutil = "^2.9.0.post0"
pydantic = "^2.11.3"
pandas = "^2.2.3"
graphistry = "^0.36.0"
pyarrow = "^19.0.1"
seaborn = "^0.13.2"
networkx = "^3.4.2"
matplotlib = "^3.10.1"
graphframes-latest = "^0.8.3"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.14.0"
pytest = "^8.3.4"
ipython = "^8.31.0"
pandas-stubs = "^2.2.3.241126"
ipykernel = "^6.29.5"
nbformat = "^5.10.4"
jupyter-black = "^0.4.0"
pre-commit = "^4.1.0"
jupyter = "^1.1.1"
nbdime = "^4.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[[tool.poetry.source]]
name = "rapids"
url = "https://pypi.nvidia.com"
priority = "supplemental"

[tool.black]
line-length = 100
target-version = ["py312"]
include = ["abzu", "tests"]

[tool.flake8]
max-line-length = 100

[tool.isort]
profile = "black"
src_paths = ["abzu", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["abzu", "tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "abzu.baml_client.*"
ignore_errors = true

[tool.pytest]
testpaths = ["tests"]
