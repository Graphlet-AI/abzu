   apiVersion: dapr.io/v1alpha1
   kind: Component
   metadata:
     name: cachepubsub
   spec:
     type: pubsub.redis
     version: v1
     metadata:
     - name: redisHost
       value: redis:6379
     - name: redisPassword
       value: abzu_redis_pass
     auth:
       secretStore: local-secret-store