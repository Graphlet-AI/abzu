services:
  # Main Abzu application
  abzu:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app}
      - SPARK_MASTER=${SPARK_MASTER:-spark://spark-master:7077}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-4g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
      # Add your API keys here
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key}
      # Caching mode: 'none', 'local', or 'hybrid' (default: 'none')
      - ABZU_CACHE_MODE=${ABZU_CACHE_MODE:-none}
      # Dapr state store name
      - DAPR_STATE_STORE=${DAPR_STATE_STORE:-statestore}
      # Dapr S3 binding name
      - DAPR_S3_BINDING=${DAPR_S3_BINDING:-s3storage}
      # Redis connection (for local/hybrid caching)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-abzu_redis_pass}
      # S3/MinIO connection (for hybrid caching)
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-abzu-cache}
      # Dapr sidecar
      - DAPR_GRPC_PORT=${DAPR_GRPC_PORT:-50001}
      - DAPR_HTTP_PORT=${DAPR_HTTP_PORT:-3500}
      - DAPR_APP_PORT=${DAPR_APP_PORT:-3501}
    ports:
      - "${DAPR_GRPC_PORT:-50001}:50001" # Dapr gRPC
      - "${DAPR_HTTP_PORT:-3500}:3500"  # Dapr HTTP
      - "${DAPR_APP_PORT:-3501}:3501"  # Abzu app port
    depends_on:
      - spark-master
      - redis
      - minio
    command: tail -f /dev/null  # Keep container running
    networks:
      - abzu-dapr

  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=${SPARK_MODE:-master}
      - SPARK_RPC_AUTHENTICATION_ENABLED=${SPARK_RPC_AUTHENTICATION_ENABLED:-no}
      - SPARK_RPC_ENCRYPTION_ENABLED=${SPARK_RPC_ENCRYPTION_ENABLED:-no}
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=${SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED:-no}
      - SPARK_SSL_ENABLED=${SPARK_SSL_ENABLED:-no}
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-18080}:8080"
    volumes:
      - ./spark-data:/data
    networks:
      - abzu-dapr

  spark-worker:
    image: bitnami/spark:latest
    container_name: spark-worker
    environment:
      - SPARK_MODE=${SPARK_MODE_WORKER:-worker}
      - SPARK_MASTER_URL=${SPARK_MASTER_URL:-spark://spark-master:7077}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_RPC_AUTHENTICATION_ENABLED=${SPARK_RPC_AUTHENTICATION_ENABLED:-no}
      - SPARK_RPC_ENCRYPTION_ENABLED=${SPARK_RPC_ENCRYPTION_ENABLED:-no}
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=${SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED:-no}
      - SPARK_SSL_ENABLED=${SPARK_SSL_ENABLED:-no}
    ports:
      - "${SPARK_WORKER_UI_PORT:-18081}:8081"
    volumes:
      - ./spark-data:/data
    depends_on:
      - spark-master
    networks:
      - abzu-dapr

  jupyter:
    image: jupyter/base-notebook:latest
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-abzu}
      - JUPYTER_PORT=${JUPYTER_PORT:-8888}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    networks:
      - abzu-dapr

  # Dapr sidecar for Abzu (added for hybrid caching/workflow)
  abzu-dapr:
    image: "daprio/daprd:edge"
    command: [
      "./daprd",
      "--app-id", "abzu",
      "--app-port", "${DAPR_APP_PORT:-3501}",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/dapr_configs",
      "--log-level", "debug"
    ]
    volumes:
      - ./dapr_configs:/dapr_configs
    depends_on:
      - placement
    network_mode: "service:abzu"

  # Redis for Dapr state store (added for hybrid caching)
  redis:
    image: "redis:latest"
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-abzu_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./cache:/data
    networks:
      - abzu-dapr

  # MinIO for S3-compatible object storage (added for hybrid caching)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # MinIO Console
    volumes:
      - ./minio-data:/data
    networks:
      - abzu-dapr

  # Dapr placement service (required for workflow)
  placement:
    image: "daprio/dapr"
    command: ["./placement", "--port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - abzu-dapr


networks:
  abzu-dapr:

volumes:
  minio-data:
  cache: 